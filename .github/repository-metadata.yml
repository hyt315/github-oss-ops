repository: hyt315/github-oss-ops
description: Approval-gated Agent Skill for GitHub Issue triage, PR review assistance, releases and repository health reporting.
topics:
  - agent-skills
  - github
  - github-actions
  - issue-triage
  - maintainer-tools
  - open-source
  - pull-request-review
  - release-automation
  - repository-management
  - workflow-automation
features:
  issues: true
  discussions: true
  private-vulnerability-reporting: true
# 期望的仓库配置（需在 Settings 中手动应用；截至 2026-11-08 main 尚未配置规则集）
ruleset:
  target: main
  require-pull-request: true
  # CI 改为 Python 矩阵后，检查名带版本后缀
  require-status-checks:
    - validate (3.10)
    - validate (3.12)
  block-force-push: true
  block-deletion: true
release:
  tag: v2.2.1
  title: GitHub OSS Ops v2.2.1
